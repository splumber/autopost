services:
  autopost:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - autopost_data:/data
      - ./config/local.yaml:/app/config/local.yaml:ro
    env_file:
      - .env
    environment:
      - AUTOPOST_DATA_DIR=/data
    # The local LLM proxy runs on the host machine (localhost:20128), so the
    # container needs host networking access to it:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  autopost_data:
